name: AutoCare Intelligence CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Quality & Regression Suite (127 Unit/Integration Tests + Additive E2E)
  # ============================================================================
  backend-regression:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autocare_dw
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:3.7.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          CLUSTER_ID: "4L62EnnTTMbgQKd3f0Daww"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary>=2.9.9 kafka-python>=2.0.2 pytest httpx

      - name: Initialize Test Warehouse Schema
        env:
          PGPASSWORD: postgres_ci_password
        run: |
          psql -h localhost -U postgres -d autocare_dw -f sql/ddl/01_create_warehouse_schema.sql
          psql -h localhost -U postgres -d autocare_dw -f sql/ml/01_create_ml_inference_schema.sql
          psql -h localhost -U postgres -d autocare_dw -f sql/ml/02_create_action_logs_schema.sql

      - name: Run Backend Regression Test Suite
        env:
          AUTOCARE_DB_HOST: localhost
          AUTOCARE_DB_PORT: 5432
          AUTOCARE_DB_NAME: autocare_dw
          AUTOCARE_DB_USER: postgres
          AUTOCARE_DB_PASSWORD: postgres_ci_password
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          AUTOCARE_ADMIN_KEY: ci-admin-secret-key-001
          AUTOCARE_DEALER_KEY: ci-dealer-secret-key-002
          AUTOCARE_ANALYST_KEY: ci-analyst-secret-key-003
        run: |
          pytest tests/ -v --durations=10

  # ============================================================================
  # 2. Frontend Quality & Component Test Suite (23 Vitest Tests)
  # ============================================================================
  frontend-regression:
    name: Frontend Vitest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Execute Vitest Suite
        run: npm test -- --run

  # ============================================================================
  # 3. Docker Multi-Stage Image Build Verification
  # ============================================================================
  docker-build-verification:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: autocareintelligence-backend:ci

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: autocareintelligence-frontend:ci

      - name: Build Automation Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          tags: autocareintelligence-automation-worker:ci

  # ============================================================================
  # 4. Continuous Delivery (CD) Release Staging & Deployment Architecture
  # ============================================================================
  cd-release-staging:
    name: Continuous Delivery Pipeline
    needs: [backend-regression, frontend-regression, docker-build-verification]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Secret & Environment Configuration
        run: |
          echo "CD Pipeline Ready."
          echo "Target Cloud: AWS ECS Fargate / Google Cloud Run"
          echo "Secret Management: OIDC Workload Identity / AWS Secrets Manager"
          echo "Deployment Gate: Multi-service container images verified."
          echo "Note: Live deployment remains BLOCKED pending Project Owner provision of active cloud credentials."
